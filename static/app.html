<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<title>AgentBase</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js" integrity="sha384-cwS6YdhLI7XS60eoDiC+egV0qHp8zI+Cms46R0nbn8JrmoAzV9uFL60etMZhAnSu" crossorigin="anonymous"></script>
<script>marked.setOptions({ breaks: true, gfm: true });</script>
<link rel="stylesheet" href="/static/app.css">
<body>

<!-- ═════════════════════ SIDEBAR ═════════════════════ -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="logo-row">
            <div class="logo" id="brand-logo">AgentBase</div>
            <select id="lang-select" aria-label="Language" onchange="switchLang(this.value)" class="lang-select">
                <option value="zh">中文</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="workspace-select" id="workspace-select-wrap">
            <div class="csel-row">
                <select id="workspace-select" aria-label="选择工作区" onchange="onWorkspaceChange(this.value)">
                    <option value="">—</option>
                </select>
                <button onclick="showWorkspaceModal()" title="新建工作区">+</button>
            </div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section">
            <div class="nav-section-title" id="nav-section-main">底座</div>
            <div class="nav-item active" data-view="settings" onclick="navigateTo('#/settings')">
                <span class="nav-icon">⚙️</span><span class="nav-label" id="nav-label-settings">设置</span>
            </div>
            <div class="nav-item" data-view="debug" onclick="navigateTo('#/dev')">
                <span class="nav-icon">🧪</span><span class="nav-label" id="nav-label-debug">调试</span>
            </div>
        </div>
    </nav>

    <div id="license-bar" style="padding:6px 16px;font-size:11px;text-align:center;display:none;"></div>

    <div class="sidebar-footer">
        <button id="system-update-btn" onclick="doSystemUpdate(event)" data-tip="更新系统">⬆️</button>
        <button id="system-restart-btn" onclick="doSystemRestart(event)" data-tip="重启" hidden>♻️</button>
    </div>
</aside>

<!-- ═════════════════════ MAIN ═════════════════════ -->
<main class="main" id="main-content">
    <!-- filled dynamically by showRoute() -->
</main>

<!-- ═════════════════════ MODALS ═════════════════════ -->

<!-- Workspace Modal -->
<div class="modal-backdrop hidden" id="workspace-modal">
    <div class="modal wide">
        <h3 id="workspace-modal-title">工作区设置</h3>
        <div style="margin-bottom:14px;" id="workspace-list-ui"></div>
        <hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">
        <h4 style="font-size:13px;font-weight:600;margin-bottom:10px;" id="workspace-create-title">新建工作区</h4>
        <div class="form-row">
            <div class="form-group"><label for="co-name">名称 *</label><input type="text" id="co-name" placeholder="例如：项目 A" oninput="autoSlug()"></div>
            <div class="form-group"><label for="co-slug">Slug</label><input type="text" id="co-slug" readonly placeholder="自动生成" style="color:var(--text-muted);background:var(--bg-main);cursor:not-allowed;"></div>
        </div>
        <div class="form-actions">
            <button class="btn" onclick="hideModal('workspace-modal')">关闭</button>
            <button class="btn btn-primary" onclick="createWorkspace()" id="workspace-create-btn">创建工作区</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>let TOKEN = "__AGENTBASE_SESSION_TOKEN__";</script>
<script src="/static/app.js"></script>
</html>
