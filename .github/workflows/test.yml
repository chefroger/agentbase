name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install ruff
      - name: Python syntax check
        run: |
          python -m compileall -q agentbase/ server.py
          echo "✓ All files compile successfully"
      - run: ruff check agentbase/ server.py
      - name: Frontend utils tests (node:test, 零依赖)
        run: node --test "tests_js/**/*.test.js"

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 产品只支持 Python 3.14（install.sh 精确校验；Hermes 只发 3.14 依赖集）
        python-version: ["3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # 与用户安装路径一致：用仓库的 requirements 文件，避免 CI 依赖清单漂移
          pip install -r requirements.txt
          pip install -r requirements-hermes.txt
          pip install pytest pytest-asyncio httpx
          pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest tests/ -v
