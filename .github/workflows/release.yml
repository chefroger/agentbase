name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            spec: desktop-mac.spec
            package: macos
            artifact: macos-arm64
          # Intel Mac（macos-latest 是 arm64）；该 label 可用到 2027-08
          - name: macOS Intel
            os: macos-15-intel
            spec: desktop-mac.spec
            package: macos
            artifact: macos-intel
          - name: Windows x64
            os: windows-latest
            spec: desktop-windows.spec
            package: windows
            artifact: windows-x64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Upgrade pip
        shell: bash
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        shell: bash
        run: |
          # 与 install.sh 一致：Hermes 以 vendor/ 源码分发，不 pip 安装 hermes-agent
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-hermes.txt
          python -m pip install "pyinstaller>=6.0"
          python -m pip install -e . --no-deps

      - name: Clean old builds
        shell: bash
        run: rm -rf build dist

      - name: Build with PyInstaller
        shell: bash
        run: python -m PyInstaller --clean --noconfirm ${{ matrix.spec }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
          else
            VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "version=$VER"

      - name: Package macOS
        if: matrix.package == 'macos'
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          cd dist
          ARCH="$(uname -m)"   # arm64 / x86_64 —— 产物按架构区分
          zip -r "AgentBase-${VER}-macOS-${ARCH}.zip" "AgentBase.app"
          rm -rf "AgentBase.app"

      - name: Package Windows
        if: matrix.package == 'windows'
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          cd dist
          mv "AgentBase.exe" "AgentBase-${VER}-windows-x64.exe"

      - name: Verify artifact
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: |
          if [ "${{ matrix.package }}" = "macos" ]; then
            f="$(ls dist/AgentBase-${VER}-macOS-*.zip)"
          else
            f="dist/AgentBase-${VER}-windows-x64.exe"
          fi
          [ -s "$f" ] || { echo "::error::产物缺失或为空：$f"; exit 1; }
          du -h "$f"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: AgentBase-${{ matrix.artifact }}
          path: |
            dist/AgentBase-*.zip
            dist/AgentBase-*.exe
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgentBase-*.zip
            dist/AgentBase-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
